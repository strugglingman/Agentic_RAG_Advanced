[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -ra --strict-markers -m "not integration and not external and not manual and not e2e"
markers =
    unit: Deterministic unit test with no external services.
    component: API/component test using local process fixtures only.
    integration: Requires local infrastructure (Postgres/Redis/Qdrant/Prisma engine).
    external: Requires internet or paid third-party API access.
    manual: Exploratory/manual script-style test, not for CI gates.
    e2e: Full-stack end-to-end workflow.
