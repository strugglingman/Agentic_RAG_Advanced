apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: agentic-rag
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: backend-service-account
      containers:
        - name: backend
          image: "__BACKEND_IMAGE__"
          imagePullPolicy: "__BACKEND_IMAGE_PULL_POLICY__"
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: backend-uploads
              mountPath: /app/uploads
            - name: backend-downloads
              mountPath: /app/downloads
            - name: backend-logs
              mountPath: /app/logs
      volumes:
        - name: backend-uploads
          emptyDir: {}
        - name: backend-downloads
          emptyDir: {}
        - name: backend-logs
          emptyDir: {}
