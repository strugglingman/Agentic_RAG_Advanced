services:
  # =============================================================================
  # Nginx Reverse Proxy
  # =============================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # Uncomment when SSL certificates are in ./nginx/ssl/
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      # Uncomment when SSL certificates are available:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      # - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bind to loopback only. Host access remains available over SSH on the EC2 host,
    # but the database is no longer exposed on every network interface.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis Cache
  # =============================================================================
  redis:
    image: redis:7-alpine
    # Bind to loopback only. Keep host debugging access without exposing Redis broadly.
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Qdrant Vector Database
  # =============================================================================
  qdrant:
    image: qdrant/qdrant:v1.16.2
    ports:
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Backend (FastAPI)
  # =============================================================================
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/downloads:/app/downloads
      - ./backend/logs:/app/logs
      - ./backend/org_structure.json:/app/org_structure.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Database URLs come from root .env host/port settings so local Docker and RDS can share one source of truth.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?schema=chatbot
      - CHECKPOINT_POSTGRES_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - QDRANT_URL=http://qdrant:6333
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET}
      - SERVICE_AUTH_ISSUER=${SERVICE_AUTH_ISSUER}
      - SERVICE_AUTH_AUDIENCE=${SERVICE_AUTH_AUDIENCE}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-agentic-rag-backend}
      - OTEL_SERVICE_NAMESPACE=${OTEL_SERVICE_NAMESPACE:-agentic-rag}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-1.0.0}
      - OTEL_DEPLOYMENT_ENVIRONMENT=${OTEL_DEPLOYMENT_ENVIRONMENT:-docker}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://obs-alloy:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_INSECURE=true
    networks:
      - default
      - observability-network

  # =============================================================================
  # Frontend (Next.js)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_UPLOAD_FILE_LIMIT_MB: ${NEXT_PUBLIC_UPLOAD_FILE_LIMIT_MB:-25}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - FASTAPI_URL=http://backend:5001
      - NEXTAUTH_URL=${APP_BASE_URL:-http://localhost}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?schema=chatbot
      - AUTH_TRUST_HOST=true
      # Service-to-service authentication (must match backend values)
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET}
      - SERVICE_AUTH_ISSUER=${SERVICE_AUTH_ISSUER}
      - SERVICE_AUTH_AUDIENCE=${SERVICE_AUTH_AUDIENCE}
      # Upload and ingestion settings
      - NEXT_PUBLIC_UPLOAD_FILE_LIMIT_MB=${NEXT_PUBLIC_UPLOAD_FILE_LIMIT_MB:-25}
      - INGEST_TIMEOUT_MS=600000
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    # Internal network for RAG app services
  observability-network:
    # Shared with agentic_rag_observability so Alloy can scrape /metrics
    external: true
    name: observability-network
