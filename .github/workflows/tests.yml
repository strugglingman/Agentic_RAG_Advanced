name: Tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run backend integration lane"
        required: false
        default: "false"
      run_e2e:
        description: "Run frontend Playwright smoke lane"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  backend-fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Prisma client
        run: |
          python -m prisma generate
          python -m prisma py fetch --force
      - name: Run backend fast lane
        run: python -m pytest tests

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Start infra stack
        working-directory: .
        run: |
          test -f backend/.env || cp backend/.env.example backend/.env
          docker compose up -d postgres redis qdrant
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Prisma client
        run: |
          python -m prisma generate
          python -m prisma py fetch --force
      - name: Run backend integration lane
        run: python -m pytest -o addopts="-q -ra --strict-markers -m \"integration and not manual and not external\"" tests
      - name: Tear down infra stack
        if: always()
        working-directory: .
        run: |
          test -f backend/.env || cp backend/.env.example backend/.env
          docker compose down -v

  frontend-e2e:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke lane
        run: npm run test:e2e


